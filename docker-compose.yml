services:

  app:
    build: .
    image: permisos-snap:latest
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL:        ${DATABASE_URL}
      SECRET_KEY:          ${SECRET_KEY:-django-insecure-change-me}
      CEROFILAS_TOKEN:     ${CEROFILAS_TOKEN}
      CEROFILAS_API_BASE:  ${CEROFILAS_API_BASE:-https://conaf.cerofilas.gob.cl/backend/api}
      DJANGO_ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost}
      GMAIL_REDIRECT_URI:  ${GMAIL_REDIRECT_URI:-http://localhost/auth/gmail/callback}
      MYMEMORY_EMAIL:      ${MYMEMORY_EMAIL:-}
    volumes:
      - ./Investigaciones:/app/Investigaciones
      - ./gmail_auth:/app/gmail_auth
      - ./fotos_portada:/app/fotos_portada
      - cache_adjuntos:/app/cache_adjuntos
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/salud"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  cache_adjuntos:
