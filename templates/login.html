<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CONAF – Iniciar Sesión</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0F2E14;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: #1B4F1E;
      border: 1px solid #2D6A2D;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .brand {
      text-align: center;
      margin-bottom: 36px;
    }

    .brand-icon {
      font-size: 48px;
      margin-bottom: 12px;
      display: block;
    }

    .brand-name {
      color: #E8F5E9;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .brand-sub {
      color: #81C784;
      font-size: 13px;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #A5D6A7;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      background: #0F2E14;
      border: 1px solid #2D6A2D;
      border-radius: 8px;
      color: #E8F5E9;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #4CAF50;
    }

    input[type="text"]::placeholder,
    input[type="password"]::placeholder {
      color: #4A7A4A;
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background: #2E7D32;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
      letter-spacing: 0.02em;
    }

    .btn-submit:hover { background: #388E3C; }
    .btn-submit:active { background: #1B5E20; }

    .error-msg {
      background: rgba(183,28,28,0.25);
      border: 1px solid rgba(183,28,28,0.5);
      border-radius: 8px;
      padding: 10px 14px;
      color: #EF9A9A;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .footer-text {
      text-align: center;
      color: #4A7A4A;
      font-size: 11px;
      margin-top: 28px;
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="brand">
    <span class="brand-icon">🌿</span>
    <div class="brand-name">CONAF · Permisos SNAP</div>
    <div class="brand-sub">Sistema de Seguimiento</div>
  </div>

  {% if form.errors %}
  <div class="error-msg">
    Usuario o contraseña incorrectos. Intente nuevamente.
  </div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label for="id_username">Correo electrónico</label>
      <input type="text" id="id_username" name="username"
             placeholder="correo@conaf.cl"
             autocomplete="username" autofocus />
    </div>
    <div class="form-group">
      <label for="id_password">Contraseña</label>
      <input type="password" id="id_password" name="password"
             placeholder="••••••••"
             autocomplete="current-password" />
    </div>
    <input type="hidden" name="next" value="{{ next }}" />
    <button type="submit" class="btn-submit">Ingresar</button>
  </form>

  <div class="footer-text">
    Corporación Nacional Forestal – Uso interno
  </div>
</div>

</body>
</html>
