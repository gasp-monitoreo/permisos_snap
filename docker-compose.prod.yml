services:
  permisos-app:
    image: permisos-snap:latest
    build: .
    restart: unless-stopped
    env_file: .env.prod
    # red del host: la app usa el Postgres local de la VM (localhost:5432)
    network_mode: host
    volumes:
      - ./Investigaciones:/app/Investigaciones
      - ./gmail_auth:/app/gmail_auth
      - ./fotos_portada:/app/fotos_portada
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/salud"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s   # al arrancar precarga 3 años de trámites y el índice de Drive
