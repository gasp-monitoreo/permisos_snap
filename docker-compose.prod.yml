services:
  permisos-app:
    image: permisos-snap:latest
    build: .
    restart: unless-stopped
    env_file: .env.prod
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - ./Investigaciones:/app/Investigaciones
      - ./gmail_auth:/app/gmail_auth
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
